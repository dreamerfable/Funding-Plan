<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" />
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=dm-sans:400,500,600,700|public-sans:400,500,600,700|lexend-deca:400" rel="stylesheet" />
  <title>九亦</title>
  <meta name="description" content="九亦 — 个人资产配置计划、持仓快照与偏离分析">
  <style>html { background-color: #fafafa } html.dark { background-color: #09090b }</style>
  <script>
    (function () {
      var mode = localStorage.getItem('funding-plan-theme') || 'auto'
      var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      if (dark) {
        document.documentElement.classList.add('dark')
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', '#09090b')
      }
    })()
  </script>
</head>

<body>
  <div id="app" class="isolate"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
